    <!-- Land every visitor on the apex host before the app boots. The API
         lives on the apex origin; a document left on www.helpcertify.com
         makes every /api/* fetch a cross-origin request that the www->apex
         redirect turns into a preflight-across-origins failure ("Failed to
         fetch"). vercel.json also skips /api in that redirect as a backstop. -->
    <script>
      if (location.hostname === 'www.helpcertify.com') {
        location.replace('https://helpcertify.com' + location.pathname + location.search + location.hash);
      }
    </script>

    <script>
      // The app is light by default. Dark mode only applies when an admin
      // has enabled the feature (mirrored to localStorage as
      // hc_dark_allowed by src/store/useThemeStore.ts) AND the visitor
      // picked dark on this device. Running it here — before any CSS/JS
      // bundle — keeps a returning dark-mode visitor from seeing a flash of
      // light first.
      (function () {
        try {
          if (
            localStorage.getItem('theme') === 'dark' &&
            localStorage.getItem('hc_dark_allowed') === '1'
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
