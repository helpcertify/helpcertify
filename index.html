<!doctype html>

    <meta charset="UTF-8" />
    <!-- Land every visitor on the apex host before the app boots. The API
         lives on the apex origin; a document left on www.helpcertify.com
         makes every /api/* fetch a cross-origin request that the www->apex
         redirect turns into a preflight-across-origins failure ("Failed to
         fetch"). vercel.json also skips /api in that redirect as a backstop. -->
    <script>
      if (location.hostname === 'www.helpcertify.com') {
        location.replace('https://helpcertify.com' + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070a" />

    />

         its own homepage, as a reference for what a well-described site in

    <script>
      // Runs synchronously before any CSS/JS bundle loads, so the correct
      // theme class is already on <html> by first paint — without this, a
      // dark-mode visitor would see a flash of the light background before
      // src/store/useThemeStore.ts's module-load logic (which does the same
      // check) gets a chance to run.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
