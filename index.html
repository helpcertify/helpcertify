<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070a" />
    <meta
      name="description"
      content="Helpcertify is a certification exam prep platform: timed mock exams, large resumable practice question banks, and personalized study plans for IT, security, cloud, and project-management certifications."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Helpcertify: Certification Exam Prep</title>
    <script>
      // Runs synchronously before any CSS/JS bundle loads, so the correct
      // theme class is already on <html> by first paint — without this, a
      // dark-mode visitor would see a flash of the light background before
      // src/store/useThemeStore.ts's module-load logic (which does the same
      // check) gets a chance to run.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
