    <meta

      content="certification exam prep, practice tests, mock exams, IT certification, CISA, CISM, AWS certification, online learning, exam practice questions, study plan"
    />

    <meta property="og:site_name" content="HelpCertify" />
    <meta property="og:url" content="https://helpcertify.com/" />

    <meta
      property="og:description"
      content="HelpCertify is a certification exam prep platform: timed mock exams, large resumable practice question banks, and personalized study plans for IT, security, cloud, and project-management certifications."
    />
    <meta property="og:image" content="https://helpcertify.com/og-image.png" />

    <link

      rel="stylesheet"
    />
    <title>HelpCertify: Certification Exam Prep</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "HelpCertify",
        "url": "https://helpcertify.com/",
        "description": "Online certification exam-preparation and practice-test platform operated by IndyaBees: timed mock exams, large resumable practice question banks, and personalized study plans for IT, security, cloud, and project-management certifications.",
        "logo": "https://helpcertify.com/og-image.png",
        "parentOrganization": {
          "@type": "Organization",
          "name": "IndyaBees"
        }
      }
    </script>
    <script>
      // Runs synchronously before any CSS/JS bundle loads, so the correct
      // theme class is already on <html> by first paint — without this, a
      // dark-mode visitor would see a flash of the light background before
      // src/store/useThemeStore.ts's module-load logic (which does the same
      // check) gets a chance to run.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
