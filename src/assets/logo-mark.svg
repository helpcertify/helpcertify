<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Helpcertify">
  <defs>
    <linearGradient id="badgeGrad" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#2E9186"/>
      <stop offset="55%" stop-color="#1C6E66"/>
      <stop offset="100%" stop-color="#124F4A"/>
    </linearGradient>
    <linearGradient id="badgeGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="checkBase" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B7A6E"/>
      <stop offset="100%" stop-color="#57C9AF"/>
    </linearGradient>
    <linearGradient id="checkGloss" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FA593"/>
      <stop offset="100%" stop-color="#8FE3CB"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C4A5E"/>
      <stop offset="100%" stop-color="#16303F"/>
    </linearGradient>
    <linearGradient id="capBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D3C4D"/>
      <stop offset="100%" stop-color="#122837"/>
    </linearGradient>
    <linearGradient id="tassel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3C15C"/>
      <stop offset="100%" stop-color="#D69A2E"/>
    </linearGradient>
  </defs>

  <!-- badge: rounded, gently cut-cornered seal shape -->
  <path
    d="M28 8
       H72
       L92 26
       V70
       L74 92
       H26
       L8 70
       V26
       Z"
    fill="url(#badgeGrad)"
  />
  <path
    d="M28 8
       H72
       L92 26
       V70
       L74 92
       H26
       L8 70
       V26
       Z"
    fill="url(#badgeGloss)"
  />

  <!-- checkmark, two-tone glossy stroke -->
  <path
    d="M22 52 L41 71 L80 26"
    fill="none"
    stroke="url(#checkBase)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M22 52 L41 71 L80 26"
    fill="none"
    stroke="url(#checkGloss)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  />

  <!-- graduation cap, tilted over the top-right corner -->
  <g transform="translate(58,-6) rotate(6)">
    <polygon points="21,0 42,10 21,20 0,10" fill="url(#capTop)"/>
    <rect x="11" y="10" width="20" height="7" rx="2" fill="url(#capBand)"/>
    <circle cx="21" cy="10" r="2.1" fill="#0F2530"/>
    <path d="M33 12 L33 21" stroke="#0F2530" stroke-width="2" stroke-linecap="round"/>
    <path d="M33 21 q4 4 0.5 9 q-3.5 4 0 8" fill="none" stroke="url(#tassel)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="33.2" cy="39" r="2.6" fill="url(#tassel)"/>
  </g>
</svg>
