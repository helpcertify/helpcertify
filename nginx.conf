server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # vite-plugin-pwa regenerates the service worker with a fresh revision on
  # every build — it must never be served stale from a cache.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: any path not matching a real file resolves to index.html
  # so client-side routes (react-router) survive a hard refresh/deep link.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
